server:
  port: 8084

spring:
  application:
    name: ms-cotizaciones
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/db_cotizaciones
    username: ${DB_USER:ferreteria}
    password: ${DB_PASSWORD:ferreteria123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:ferreteria}
    password: ${RABBITMQ_PASSWORD:ferreteria123}
    listener:
      simple:
        default-requeue-rejected: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$FeignClientException
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

cotizacion:
  dias-vigencia: 7
  igv: 0.18
  intervalo-vencimiento-ms: 60000
