server:
  port: 8085

spring:
  application:
    name: ms-ventas
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/db_ventas
    username: ${DB_USER:ferreteria}
    password: ${DB_PASSWORD:ferreteria123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:ferreteria}
    password: ${RABBITMQ_PASSWORD:ferreteria123}
    listener:
      simple:
        default-requeue-rejected: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

venta:
  horas-limite-pago: 24
  igv: 0.18
  intervalo-vencimiento-ms: 60000
